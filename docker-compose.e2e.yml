# FIOR Protocol E2E Test Stack
#
# Starts a local nostr relay + runs the FIOR protocol e2e test.
#
# Usage:
#   docker compose up --build --abort-on-container-exit
#
# The e2etest exits 0 on success, non-zero on failure.

services:
  relay:
    image: scsibug/nostr-rs-relay:latest
    volumes:
      - relay-data:/usr/src/app/db
      - ./relay-config.toml:/usr/src/app/config.toml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"

  e2etest:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - FIOR_RELAY=ws://relay:8080
    depends_on:
      relay:
        condition: service_healthy
    restart: "no"

volumes:
  relay-data:
